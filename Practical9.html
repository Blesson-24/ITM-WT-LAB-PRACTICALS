<!doctype html>
<html>
  <head>
    <title>Text Growing and Shrinking</title>
  </head>
  <body>
    <h2 id="text" style="text-align: center">Welcome to JavaScript</h2>

    <script>
      let size = 10;
      let growing = true;

      function changeSize() {
        let text = document.getElementById("text");

        text.style.fontSize = size + "px";

        if (size >= 50) {
          growing = false;
        }

        if (size <= 10) {
          growing = true;
        }

        if (growing) {
          size += 2;
        } else {
          size -= 2;
        }
      }

      setInterval(changeSize, 200);
    </script>
  </body>
</html>
